version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lead-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leaduser
      POSTGRES_PASSWORD: leadpass
      POSTGRES_DB: leadgenerator
    volumes:
      - lead_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaduser -d leadgenerator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lead-redis
    restart: unless-stopped
    volumes:
      - lead_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lead-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-openwa:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://leaduser:leadpass@postgres:5432/leadgenerator
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules

  mock-openwa:
    image: node:20-alpine
    container_name: lead-mock-openwa
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./mock-openwa.js:/app/mock-openwa.js:ro
    working_dir: /app
    command: ["node", "mock-openwa.js"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lead-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://leaduser:leadpass@postgres:5432/leadgenerator
      REDIS_URL: redis://redis:6379
      WORKER_ONLY: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: ["node", "dist/worker.js"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lead-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:80"

volumes:
  lead_postgres_data:
  lead_redis_data:
